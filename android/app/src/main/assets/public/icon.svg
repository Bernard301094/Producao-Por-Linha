<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de fondo oscuro y profundo -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente dorado premium para el acento -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Sombra base para dar profundidad -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Resplandor sutil (glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Hexágono abstracto de fondo (Estructura/Industria) -->
  <path d="M256 100 L390 177 V335 L256 412 L122 335 V177 Z" fill="none" stroke="#334155" stroke-width="6" opacity="0.4"/>
  <path d="M256 120 L372 188 V324 L256 392 L140 324 V188 Z" fill="none" stroke="#475569" stroke-width="2" opacity="0.2"/>

  <!-- Símbolo principal: Check / Gráfico de crecimiento ascendente -->
  <!-- Se utiliza el filter de sombra para que "flote" sobre el fondo -->
  <path d="M168 276 L236 344 L360 176" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="40" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#drop-shadow)"/>

  <!-- Detalle brillante en la punta del gráfico -->
  <circle cx="360" cy="176" r="20" fill="#FEF3C7" filter="url(#glow)"/>
</svg>
