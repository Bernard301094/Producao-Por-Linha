# This workflow compiles and generates an Android APK (Debug and optimally Release if signed) using Capacitor.
# 
# To generate a signed Release APK, add the following Repository Secrets in GitHub:
# - KEYSTORE_BASE64: The base64 encoded sequence of your .jks/.keystore file (generate using `base64 release.keystore > keystore_base64.txt`)
# - KEYSTORE_PASSWORD: The password for the keystore
# - KEY_ALIAS: The alias you used when creating the key
# - KEY_PASSWORD: The password for the specific key alias
# If these are not provided, only the debug APK will be generated.

name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Regenerate launcher PNG icons (fix AAPT2 corrupt PNG error)
        run: |
          pip install Pillow --quiet
          python3 - <<'EOF'
          from PIL import Image
          import os

          # Android mipmap sizes: (folder, size_px)
          sizes = [
            ("mipmap-ldpi",    36),
            ("mipmap-mdpi",    48),
            ("mipmap-hdpi",    72),
            ("mipmap-xhdpi",   96),
            ("mipmap-xxhdpi", 144),
            ("mipmap-xxxhdpi",192),
          ]
          res_dir = "android/app/src/main/res"
          icons = ["ic_launcher.png", "ic_launcher_round.png"]

          for folder, size in sizes:
            folder_path = os.path.join(res_dir, folder)
            os.makedirs(folder_path, exist_ok=True)
            for icon in icons:
              icon_path = os.path.join(folder_path, icon)
              # Re-save existing PNG to ensure valid format, or create a placeholder
              if os.path.exists(icon_path):
                try:
                  img = Image.open(icon_path).convert("RGBA").resize((size, size), Image.LANCZOS)
                  img.save(icon_path, "PNG", optimize=False)
                  print(f"Re-saved: {icon_path}")
                except Exception as e:
                  print(f"Could not re-save {icon_path}: {e}, creating placeholder")
                  img = Image.new("RGBA", (size, size), (33, 150, 243, 255))
                  img.save(icon_path, "PNG")
              else:
                img = Image.new("RGBA", (size, size), (33, 150, 243, 255))
                img.save(icon_path, "PNG")
                print(f"Created placeholder: {icon_path}")
          EOF

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          find app/src/main/res -name "ic_launcher_background.png" -type f -delete || true

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check Keystore Secret
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_ENV
          else
            echo "has_keystore=false" >> $GITHUB_ENV
          fi

      - name: Decode Keystore
        if: env.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > android/keystore.jks

      - name: Build Release APK
        if: env.has_keystore == 'true'
        working-directory: ./android
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: env.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
