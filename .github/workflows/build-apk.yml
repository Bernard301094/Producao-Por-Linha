name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix gradle-wrapper.jar
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Regenerate launcher icons
        run: |
          sudo apt-get install -y imagemagick
          BASE="android/app/src/main/res"
          generate_icon() {
            SIZE=$1; DEST=$2
            mkdir -p "$(dirname "$DEST")"
            convert -size ${SIZE}x${SIZE} xc:#1a73e8 \
              -fill white -gravity center \
              -font DejaVu-Sans-Bold -pointsize $((SIZE/3)) \
              -annotate 0 'P' \
              "$DEST"
          }
          generate_icon 48  "$BASE/mipmap-mdpi/ic_launcher.png"
          generate_icon 48  "$BASE/mipmap-mdpi/ic_launcher_round.png"
          generate_icon 48  "$BASE/mipmap-mdpi/ic_launcher_foreground.png"
          generate_icon 72  "$BASE/mipmap-hdpi/ic_launcher.png"
          generate_icon 72  "$BASE/mipmap-hdpi/ic_launcher_round.png"
          generate_icon 72  "$BASE/mipmap-hdpi/ic_launcher_foreground.png"
          generate_icon 96  "$BASE/mipmap-xhdpi/ic_launcher.png"
          generate_icon 96  "$BASE/mipmap-xhdpi/ic_launcher_round.png"
          generate_icon 96  "$BASE/mipmap-xhdpi/ic_launcher_foreground.png"
          generate_icon 144 "$BASE/mipmap-xxhdpi/ic_launcher.png"
          generate_icon 144 "$BASE/mipmap-xxhdpi/ic_launcher_round.png"
          generate_icon 144 "$BASE/mipmap-xxhdpi/ic_launcher_foreground.png"
          generate_icon 192 "$BASE/mipmap-xxxhdpi/ic_launcher.png"
          generate_icon 192 "$BASE/mipmap-xxxhdpi/ic_launcher_round.png"
          generate_icon 192 "$BASE/mipmap-xxxhdpi/ic_launcher_foreground.png"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | openssl base64 -d -A -out android/app/release.keystore

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
