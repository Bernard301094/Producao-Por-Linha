name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix gradle-wrapper.jar
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Regenerate ALL corrupt PNGs
        run: |
          sudo apt-get install -y imagemagick
          BASE="android/app/src/main/res"

          # ---- helper functions ----
          make_icon() {
            local size=$1 dest=$2
            mkdir -p "$(dirname "$dest")"
            convert -size ${size}x${size} xc:#1a73e8 \
              -fill white -gravity center \
              -font DejaVu-Sans-Bold -pointsize $((size/3)) \
              -annotate 0 'P' "$dest"
          }

          make_splash() {
            local w=$1 h=$2 dest=$3
            mkdir -p "$(dirname "$dest")"
            convert -size ${w}x${h} xc:#1a73e8 \
              -fill white -gravity center \
              -font DejaVu-Sans-Bold -pointsize 48 \
              -annotate 0 'SheetBridge' "$dest"
          }

          # ---- Launcher icons (mdpi/hdpi/xhdpi/xxhdpi/xxxhdpi) ----
          for row in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${row%%:*}"
            size="${row##*:}"
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              make_icon $size "$BASE/mipmap-${density}/${name}.png"
            done
          done

          # ---- Splash screens ----
          # drawable (generic)
          make_splash 480 800  "$BASE/drawable/splash.png"

          # portrait variants
          make_splash 320 480  "$BASE/drawable-port-mdpi/splash.png"
          make_splash 480 800  "$BASE/drawable-port-hdpi/splash.png"
          make_splash 720 1280 "$BASE/drawable-port-xhdpi/splash.png"
          make_splash 960 1600 "$BASE/drawable-port-xxhdpi/splash.png"
          make_splash 1280 1920 "$BASE/drawable-port-xxxhdpi/splash.png"

          # landscape variants
          make_splash 800 480  "$BASE/drawable-land-mdpi/splash.png"
          make_splash 1280 720 "$BASE/drawable-land-hdpi/splash.png"
          make_splash 1600 960 "$BASE/drawable-land-xhdpi/splash.png"
          make_splash 1920 1280 "$BASE/drawable-land-xxhdpi/splash.png"
          make_splash 2560 1440 "$BASE/drawable-land-xxxhdpi/splash.png"

          echo "All PNGs regenerated successfully."

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | openssl base64 -d -A -out android/app/release.keystore

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
